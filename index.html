<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Peey 🌹</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #ff4d6d;
            --deep-red: #c9184a;
            --bg-gradient: linear-gradient(135deg, #fff0f3 0%, #ffccd5 100%);
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-gradient);
            font-family: 'Quicksand', sans-serif;
            overflow-x: hidden;
            overflow-y: auto; 
        }

        .heart-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .floating-heart {
            position: absolute;
            opacity: 0.5;
            animation: float 8s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(110vh) scale(1); }
            100% { transform: translateY(-20vh) scale(1.5); }
        }

        #container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 2rem 1.5rem;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(255, 77, 109, 0.3);
            border: 3px solid white;
            width: 85%;
            max-width: 450px;
            text-align: center;
            transition: all 0.3s ease;
            margin: 20px auto;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: var(--primary-pink);
            font-size: clamp(1.8rem, 8vw, 2.8rem);
            margin-bottom: 1rem;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 2rem;
            min-height: 120px;
            position: relative;
        }

        button {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Quicksand', sans-serif;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            -webkit-tap-highlight-color: transparent;
        }

        #yesBtn {
            background-color: var(--primary-pink);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
            z-index: 1000; /* Always on top */
            position: relative;
        }

        #noBtn {
            background-color: #fff;
            color: #6c757d;
            border: 2px solid #ffccd5;
            z-index: 900;
            white-space: nowrap;
            position: relative; 
        }

        .celebration {
            display: none;
            animation: fadeIn 0.8s ease-out;
        }

        .couple-img {
            width: 100%;
            height: auto;
            max-height: 70vh; /* Limits height so it doesn't push text off screen */
            object-fit: contain; /* Ensures the whole image is visible without cutting */
            object-position: top; /* Prioritize the top of the photo */
            border-radius: 15px;
            border: 4px solid white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }

        .celebration h2 {
            font-family: 'Dancing Script', cursive;
            color: var(--deep-red);
            font-size: clamp(1.4rem, 5vw, 2rem);
            line-height: 1.4;
            margin: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        @media (max-width: 480px) {
            #container { padding: 1.5rem 1rem; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div class="heart-bg" id="heartBg"></div>

    <div id="container">
        <div id="main-content">
            <h1>Will you be my valentines Peey🌹, MyAll💍💗</h1>
            <div class="buttons" id="buttonArea">
                <button id="yesBtn" onclick="celebrate()">Yes</button>
                <button id="noBtn" onmouseover="moveNoButton()" onclick="moveNoButton()">No</button>
            </div>
        </div>

        <div id="celebration" class="celebration">
            <img src="https://i.postimg.cc/sDrrSQBn/IMG-0443.jpg" class="couple-img" alt="Us" id="couplePhoto">
            <h2>I applaud the heavens for our unity and hope this valentines will be a memorable one for us sweetheart, I love you babe🌹</h2>
        </div>
    </div>

    <script>
        const heartBg = document.getElementById('heartBg');
        const items = ['❤️', '💖', '💍', '🌹', '✨', '💗'];
        for (let i = 0; i < 15; i++) {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.innerText = items[Math.floor(Math.random() * items.length)];
            heart.style.left = Math.random() * 95 + 'vw';
            heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
            heart.style.animationDuration = (Math.random() * 5 + 5) + 's';
            heartBg.appendChild(heart);
        }

        let yesScale = 1;
        let isFirstMove = true;

        function moveNoButton() {
            const noBtn = document.getElementById('noBtn');
            const yesBtn = document.getElementById('yesBtn');

            if (isFirstMove) {
                noBtn.style.position = 'fixed';
                isFirstMove = false;
            }
            
            const yesRect = yesBtn.getBoundingClientRect();
            const noRect = noBtn.getBoundingClientRect();
            
            // Define a radius for movement (not too far, not too close)
            const minDistance = 100;
            const maxDistance = 200;
            
            let newX, newY;
            let isValid = false;

            // Loop to find a position that isn't behind Yes and stays on screen
            while (!isValid) {
                const angle = Math.random() * Math.PI * 2;
                const dist = minDistance + Math.random() * (maxDistance - minDistance);
                
                newX = yesRect.left + (yesRect.width / 2) + Math.cos(angle) * dist;
                newY = yesRect.top + (yesRect.height / 2) + Math.sin(angle) * dist;

                // Screen Boundary Check (keeping it 30px away from edges)
                if (newX > 30 && newX < window.innerWidth - noRect.width - 30 &&
                    newY > 30 && newY < window.innerHeight - noRect.height - 30) {
                    
                    // Overlap Check: Ensure it's not actually covering the Yes button
                    if (!(newX > yesRect.left - 20 && newX < yesRect.right + 20 &&
                          newY > yesRect.top - 20 && newY < yesRect.bottom + 20)) {
                        isValid = true;
                    }
                }
            }

            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
            
            yesScale += 0.15;
            yesBtn.style.transform = `scale(${yesScale})`;
        }

        function celebrate() {
            document.getElementById('main-content').style.display = 'none';
            const celebration = document.getElementById('celebration');
            celebration.style.display = 'block';
            
            const container = document.getElementById('container');
            container.style.maxWidth = '550px';
            container.style.padding = '1.5rem';
        }
    </script>
</body>
</html>
