<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Peey 🌹</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #ff4d6d;
            --deep-red: #c9184a;
            --bg-gradient: linear-gradient(135deg, #fff0f3 0%, #ffccd5 100%);
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-gradient);
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
        }

        .heart-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .floating-heart {
            position: absolute;
            opacity: 0.5;
            animation: float 8s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(110vh) scale(1); }
            100% { transform: translateY(-20vh) scale(1.5); }
        }

        #container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 2rem 1.5rem;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(255, 77, 109, 0.3);
            border: 3px solid white;
            width: 85%;
            max-width: 450px;
            text-align: center;
            transition: all 0.3s ease;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: var(--primary-pink);
            font-size: clamp(1.8rem, 8vw, 2.5rem);
            margin-bottom: 1rem;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 2rem;
            min-height: 150px;
            position: relative;
        }

        button {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Quicksand', sans-serif;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            -webkit-tap-highlight-color: transparent;
        }

        #yesBtn {
            background-color: var(--primary-pink);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
            z-index: 1000;
            position: relative;
        }

        #noBtn {
            background-color: #fff;
            color: #6c757d;
            border: 2px solid #ffccd5;
            z-index: 999;
            white-space: nowrap;
            position: relative; 
        }

        .celebration {
            display: none;
            animation: fadeIn 0.8s ease-out;
        }

        .couple-img {
            width: 100%;
            height: auto;
            max-height: 60vh;
            object-fit: contain;
            border-radius: 15px;
            border: 5px solid white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }

        .celebration h2 {
            font-family: 'Dancing Script', cursive;
            color: var(--deep-red);
            font-size: clamp(1.4rem, 5vw, 1.9rem);
            line-height: 1.4;
            margin: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="heart-bg" id="heartBg"></div>

    <div id="container">
        <div id="main-content">
            <h1>Will you be my valentines Peey🌹, MyAll💍💗</h1>
            <div class="buttons" id="buttonArea">
                <button id="yesBtn" onclick="celebrate()">Yes</button>
                <button id="noBtn" onmouseover="moveNoButton()" onclick="moveNoButton()">No</button>
            </div>
        </div>

        <div id="celebration" class="celebration">
            <img src="https://i.postimg.cc/sDrrSQBn/IMG-0443.jpg" class="couple-img" alt="Us">
            <h2>I applaud the heavens for our unity and hope this valentines will be a memorable one for us sweetheart, I love you babe🌹</h2>
        </div>
    </div>

    <script>
        // Floating Hearts
        const heartBg = document.getElementById('heartBg');
        const items = ['❤️', '💖', '💍', '🌹', '✨', '💗'];
        for (let i = 0; i < 15; i++) {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.innerText = items[Math.floor(Math.random() * items.length)];
            heart.style.left = Math.random() * 95 + 'vw';
            heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
            heart.style.animationDuration = (Math.random() * 5 + 5) + 's';
            heartBg.appendChild(heart);
        }

        let yesScale = 1;
        let isFirstMove = true;

        function moveNoButton() {
            const noBtn = document.getElementById('noBtn');
            const yesBtn = document.getElementById('yesBtn');

            if (isFirstMove) {
                noBtn.style.position = 'fixed';
                isFirstMove = false;
            }
            
            const yesRect = yesBtn.getBoundingClientRect();
            const yesCenterX = yesRect.left + yesRect.width / 2;
            const yesCenterY = yesRect.top + yesRect.height / 2;
            
            // Tight circular radius around the Yes button
            const minRadius = 90;
            const maxRadius = 160;
            
            let newX, newY;
            let attempts = 0;
            let isValid = false;

            while (!isValid && attempts < 20) {
                const angle = Math.random() * Math.PI * 2;
                const dist = minRadius + Math.random() * (maxRadius - minRadius);
                
                newX = yesCenterX + Math.cos(angle) * dist - (noBtn.offsetWidth / 2);
                newY = yesCenterY + Math.sin(angle) * dist - (noBtn.offsetHeight / 2);

                // Ensure it stays inside the viewport with padding
                const padding = 20;
                if (newX > padding && newX < window.innerWidth - noBtn.offsetWidth - padding &&
                    newY > padding && newY < window.innerHeight - noBtn.offsetHeight - padding) {
                    isValid = true;
                }
                attempts++;
            }

            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
            
            yesScale += 0.15;
            yesBtn.style.transform = `scale(${yesScale})`;
        }

        function celebrate() {
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('celebration').style.display = 'block';
            document.getElementById('container').style.maxWidth = '550px';
            document.body.style.overflowY = 'auto'; // Allow scrolling for message/image
        }
    </script>
</body>
</html>
