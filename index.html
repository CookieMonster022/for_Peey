<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Peey 🌹</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #ff4d6d;
            --deep-red: #c9184a;
            --bg-gradient: linear-gradient(135deg, #fff0f3 0%, #ffccd5 100%);
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-gradient);
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        .heart-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .floating-heart {
            position: absolute;
            opacity: 0.5;
            animation: float 8s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(110vh) scale(1); }
            100% { transform: translateY(-20vh) scale(1.5); }
        }

        #container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 3rem 2rem;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(255, 77, 109, 0.3);
            border: 3px solid white;
            width: 90%;
            max-width: 500px;
            text-align: center;
            transition: all 0.5s ease;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: var(--primary-pink);
            font-size: clamp(2.2rem, 7vw, 3.2rem);
            margin-bottom: 1.5rem;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 2rem;
            height: 150px; /* Area for No button to move */
            position: relative;
        }

        button {
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Quicksand', sans-serif;
            transition: transform 0.2s;
        }

        #yesBtn {
            background-color: var(--primary-pink);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
            z-index: 100;
        }

        #noBtn {
            background-color: #fff;
            color: #6c757d;
            border: 2px solid #ffccd5;
            position: absolute;
            z-index: 99;
            white-space: nowrap;
        }

        /* Celebration Styles */
        .celebration {
            display: none;
            animation: slideUp 0.8s ease-out;
        }

        .couple-img {
            width: 100%;
            max-width: 350px;
            border-radius: 20px;
            border: 8px solid white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            margin-bottom: 20px;
        }

        .celebration h2 {
            font-family: 'Dancing Script', cursive;
            color: var(--deep-red);
            font-size: clamp(1.8rem, 5vw, 2.4rem);
            line-height: 1.4;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            #container { padding: 2rem 1rem; }
            .buttons { height: 200px; }
        }
    </style>
</head>
<body>

    <div class="heart-bg" id="heartBg"></div>

    <div id="container">
        <div id="main-content">
            <h1>Will you be my valentines Peey🌹, MyAll💍💗</h1>
            <div class="buttons" id="buttonArea">
                <button id="yesBtn" onclick="celebrate()">Yes</button>
                <button id="noBtn" onmouseover="moveNoButton()" onclick="moveNoButton()">No</button>
            </div>
        </div>

        <div id="celebration" class="celebration">
            <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&q=80&w=1000" class="couple-img" alt="Us" id="couplePhoto">
            <h2>I applaud the heavens for our unity and hope this valentines will be a memorable one for us sweetheart, I love you babe🌹</h2>
        </div>
    </div>

    <script>
        // 1. Setup floating hearts
        const heartBg = document.getElementById('heartBg');
        const items = ['❤️', '💖', '💍', '🌹', '✨', '💗'];
        for (let i = 0; i < 20; i++) {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.innerText = items[Math.floor(Math.random() * items.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 30 + 20) + 'px';
            heart.style.animationDuration = (Math.random() * 4 + 4) + 's';
            heart.style.animationDelay = Math.random() * 5 + 's';
            heartBg.appendChild(heart);
        }

        // 2. No Button Logic (Orbiting Radius)
        let yesScale = 1;
        function moveNoButton() {
            const noBtn = document.getElementById('noBtn');
            const yesBtn = document.getElementById('yesBtn');
            const area = document.getElementById('buttonArea');
            
            // Define radius around Yes button (staying close but reachable)
            const radius = 120; 
            const angle = Math.random() * Math.PI * 2;
            
            // Calculate new position
            const newX = Math.cos(angle) * radius;
            const newY = Math.sin(angle) * radius;

            noBtn.style.transform = `translate(${newX}px, ${newY}px)`;
            
            // Slightly grow the Yes button to make it more enticing
            yesScale += 0.15;
            yesBtn.style.transform = `scale(${yesScale})`;
        }

        // 3. Final Celebration
        function celebrate() {
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('celebration').style.display = 'block';
            document.getElementById('container').style.maxWidth = '600px';
            
            // Apply the image you shared (Paste your direct image URL here)
            // Note: Since I can't browse your local files, make sure to upload 
            // the photo to a host like Imgur and put the link here.
            const img = document.getElementById('couplePhoto');
            img.src = "https://i.postimg.cc/sDrrSQBn/IMG-0443.jpg"; 
        }
    </script>
</body>
</html>
